name: 매일 ETF 데이터 수집

on:
  schedule:
    # 평일 19:00 KST = 10:00 UTC (월~금)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:        # 깃허브에서 수동 실행 버튼

permissions:
  contents: write

concurrency:                # 동시 실행 방지(중복 크롤/커밋 충돌 차단)
  group: etf-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --quiet pykrx pandas tqdm openpyxl requests

      - name: 크롤링 (최근 영업일)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python etf_holdings.py --auto --withetf

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "변경 없음 (휴장일이거나 이미 수집됨)"
          else
            git commit -m "자동수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin main || true
            git push
          fi
